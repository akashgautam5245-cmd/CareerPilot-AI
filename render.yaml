services:
  # 1. Express Backend Web Service
  - type: web
    name: solveflow-ai-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        fromService:
          type: web
          name: solveflow-ai-frontend
          property: url
      - key: DATABASE_URL
        fromDatabase:
          name: solveflow-postgres
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: solveflow-ai-service
          property: url

  # 2. Python FastAPI AI Microservice
  - type: web
    name: solveflow-ai-service
    env: python
    region: oregon
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_MODEL
        value: gemini-2.5-flash
      - key: AI_API_KEY
        sync: false

  # 3. React Frontend Static Site
  - type: web
    name: solveflow-ai-frontend
    env: static
    region: oregon
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: solveflow-ai-backend
          property: url

databases:
  # 4. Managed PostgreSQL Database
  - name: solveflow-postgres
    region: oregon
    plan: free
    databaseName: solveflow_db
    user: solveflow_user
